# What has to be true before a change lands.
#
# Three jobs, and the ordering is deliberate: the cheap one that catches
# most mistakes runs on its own, and the expensive one that catches the
# mistakes that matter runs the real thing rather than a mock of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a dependency that breaks the build is found on a Monday rather than
  # on the day somebody needs to ship.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 12.x refuses custom rules on access policies unless the instance is
  # licensed, and those rules are the entire subject of the suite below.
  # A licence key is a secret and CI does not get one, so CI runs the last
  # unrestricted version. This is the one place the project's own README
  # and its CI deliberately differ, and it is written down in both.
  DIRECTUS_IMAGE: directus/directus:11

jobs:
  # Types and shell syntax. Sixty seconds, and it catches the class of
  # mistake that would otherwise take eight minutes of Docker to find.
  static:
    name: Types and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @enamel/time is compiled output that three packages import from,
      # so typechecking anything else before it exists reports a missing
      # module rather than a type error.
      - name: Build the shared packages
        run: |
          pnpm --filter @enamel/time build
          pnpm --filter @enamel/extension-ui build

      - name: Typecheck every package
        run: pnpm -r typecheck

      - name: Build the extensions
        run: ./scripts/build-extensions.sh

      - name: Build the patient site
        run: pnpm --filter @enamel/public build

      # `bash -n` parses without executing. Free, and the alternative is
      # finding a missing `fi` during an actual restore.
      - name: Parse the shell scripts
        run: |
          for script in scripts/*.sh apps/public/docker-entrypoint.sh; do
            bash -n "$script" && echo "  ok  $script"
          done

  # The one that matters. A permission model you have not tried to break
  # is a hope, not a policy — so this brings up Postgres, Redis, Directus,
  # the core service and the patient site, provisions from nothing, seeds,
  # and runs all of it.
  verify:
    name: The access model, against a real stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Written here rather than left to setup.sh, for one reason: setup.sh
      # sources .env *after* creating it, so an exported DIRECTUS_IMAGE
      # from this workflow would be overwritten by the value in the file.
      # The passwords are CI-local and disposable; the secrets that must
      # not be guessable are generated by setup.sh itself.
      - name: Write a CI .env
        run: |
          cp .env.example .env
          sed -i "s|^DIRECTUS_IMAGE=.*|DIRECTUS_IMAGE=${DIRECTUS_IMAGE}|" .env
          sed -i "s|^SECRET=.*|SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$(openssl rand -hex 16)|" .env

      # Provisions, seeds and runs the suite. It fails the job on its own
      # if any check fails — there is nothing to assert here that the
      # script does not already assert better.
      - name: Set up and verify
        run: ./scripts/setup.sh

      # Not a `continue-on-error` afterthought. When this job fails, the
      # question is always "which service, and saying what", and a log
      # nobody captured is a re-run.
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200

  # Proving the backup restores, in an environment that has never seen it
  # work. A backup nobody has restored is a hypothesis.
  backups:
    name: A backup that restores
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Write a CI .env
        run: |
          cp .env.example .env
          sed -i "s|^DIRECTUS_IMAGE=.*|DIRECTUS_IMAGE=${DIRECTUS_IMAGE}|" .env
          sed -i "s|^SECRET=.*|SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$(openssl rand -hex 16)|" .env

      - name: Set up and seed
        run: ./scripts/setup.sh

      - name: Take a backup
        run: ./scripts/backup.sh

      # Restores into a scratch database and asserts the rows, the named
      # records, the constraints, the triggers — and that the triggers
      # still fire, which presence in pg_trigger does not prove.
      - name: Prove it restores
        run: ./scripts/restore-test.sh

      # The archive must not be readable without the passphrase. Asserted
      # rather than assumed, because "it looked like binary" is how an
      # unencrypted backup gets shipped.
      - name: The archive is opaque without the key
        run: |
          ARCHIVE=$(ls -t backups/enamel-*.dump.enc | head -1)
          if head -c 2048 "$ARCHIVE" | grep -aq "PGDMP"; then
            echo "::error::the dump is not encrypted — PGDMP is readable in the archive"
            exit 1
          fi
          if head -c 262144 "$ARCHIVE" | strings | grep -aqiE "kadehuis|marina|@example\.com"; then
            echo "::error::patient data is readable in the archive"
            exit 1
          fi
          echo "  nothing legible in the first 256 KB"

      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200
